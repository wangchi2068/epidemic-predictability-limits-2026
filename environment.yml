name: epidemic-predictability
# Versions are pinned to a tested range with upper bounds: the reported integer
# resample counts (bootstrap / moving-block) depend on generator behaviour that
# can change across major releases, so lower bounds alone are not sufficient.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.26,<3
  - scipy>=1.12,<2
  - pandas>=2.2,<3
  - matplotlib>=3.8,<4
  - scikit-learn>=1.4,<2
  - lightgbm>=4.3,<5
  - pip
  - pip:
      - torch>=2.0,<3
